[package]
name = "orc-client"
description = "ZeroMQ PUSH client for the orc time-series engine"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
name = "orc_client"
path = "src/lib.rs"

[[bin]]
name = "orc-cli"
path = "src/bin/orc-cli.rs"

[dependencies]
orc-core.workspace = true
zmq.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# For the orc-cli binary. Never an orc-core dependency.
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
