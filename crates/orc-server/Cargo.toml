[package]
name = "orc-server"
description = "ZeroMQ PULL ingest server for the orc time-series engine"
version.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "orc-server"
path = "src/main.rs"

[dependencies]
orc-core.workspace = true
zmq.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Only the binary pulls a subscriber; `tracing` alone emits nothing.
tracing-subscriber.workspace = true
