[package]
name = "orc"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/akakaplin/orc"
description = "Embeddable time-series engine: low-latency WAL ingest, periodic Parquet flush"
license = "MIT"

[features]
# Nothing by default: the embeddable engine must not need cmake or a C++ toolchain.
default = []

# ZeroMQ server and client. Library only: no arg parsing or log formatting.
net = ["dep:zmq"]

# The shipped binaries; clap and tracing-subscriber are of no use to library users.
cli = ["net", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
# Only `lz4` (pure-Rust LZ4_RAW; zstd needs a C compiler) and `crc` (reuses crc32fast).
# No `arrow` (12 crates): src/flush/parquet.rs uses the low-level writer instead.
parquet = { version = "59.2", default-features = false, features = [
    "lz4",
    "crc",
] }

# Already pulled in by parquet; strings are sliced from one `Bytes` per column.
bytes = "1"

# Config, manifest and the control protocol.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

crc32fast = "1.5"
tracing = "0.1"

# Behind `net` because it always builds libzmq from C (cmake + C++ toolchain).
zmq = { version = "0.10", optional = true }

# Behind `cli`. No `env-filter`: five crates for nothing a single binary needs.
clap = { version = "4.6", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3.27"
# No zmq here: dev-deps can't be feature-gated; network tests use `orc::zmq`.
serde_json = "1.0"

[[bin]]
name = "orc-server"
path = "src/bin/orc-server.rs"
required-features = ["cli"]

[[bin]]
name = "orc-cli"
path = "src/bin/orc-cli.rs"
required-features = ["cli"]

[profile.release]
debug = 1

# Examples need the transport, so plain `cargo build` skips them.
[[example]]
name = "embedded_server"
required-features = ["net"]

[[example]]
name = "remote_writer"
required-features = ["net"]
