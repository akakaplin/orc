[package]
name = "orc"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/akakaplin/orc"
description = "Embeddable time-series engine: low-latency WAL ingest, periodic Parquet flush"
license = "MIT"

[features]
# Nothing by default. The embeddable engine is the common case, and it must not
# drag a C++ toolchain, cmake or a libzmq build into somebody's `cargo build`.
default = []

# ZeroMQ transport. Enables both sides -- one process can be a server, a client,
# or both. Library only: a program embedding the client gets zmq and nothing
# else, because argument parsing and log formatting are the binaries' business.
net = ["dep:zmq"]

# What the shipped binaries need on top of `net`. Kept separate because clap and
# tracing-subscriber are 28 crates that no library consumer has any use for.
cli = ["net", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
# Sanctioned: Parquet. `arrow` feature only; the default would also pull
# snap/brotli/flate2/lz4/base64/simdutf8. `crc` gates Parquet's own page
# checksums onto crc32fast, which we already depend on.
parquet = { version = "59.2", default-features = false, features = [
    "arrow",
    "zstd",
    "crc",
] }
# The sub-crates, not the `arrow` umbrella: we only build RecordBatches.
arrow-array = "59.2"
arrow-schema = "59.2"

# Sanctioned: JSON. Config, manifest and the control protocol.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Approved conveniences.
crc32fast = "1.5"
tracing = "0.1"

# Optional: only with `net`. There is no way to link a system libzmq -- zmq-sys
# 0.12's build script is nine lines that call `zeromq_src::Build::new()`
# unconditionally, so enabling this always compiles libzmq and libsodium from C
# source and always requires cmake and a C++ toolchain. That is the whole reason
# it is behind a feature.
zmq = { version = "0.10", optional = true }

# Optional: only with `cli`. `env-filter` is deliberately off -- it costs five
# crates (regex-automata, regex-syntax, matchers, thread_local, sharded-slab) to
# filter per target, and one binary has no targets worth filtering between.
clap = { version = "4.6", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3.27"
# Integration tests are a separate crate and cannot reach the library's own
# dependencies, so the ones they use are declared again here.
#
# zmq is NOT here on purpose. Dev-dependencies cannot be feature-gated, so
# declaring it would make plain `cargo test` build libzmq from source -- exactly
# what putting the transport behind `net` was meant to prevent. The network
# tests reach it through `orc::zmq` instead.
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"] }
serde_json = "1.0"

[[bin]]
name = "orc-server"
path = "src/bin/orc-server.rs"
required-features = ["cli"]

[[bin]]
name = "orc-cli"
path = "src/bin/orc-cli.rs"
required-features = ["cli"]

[profile.release]
debug = 1
