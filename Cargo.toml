[workspace]
members = ["crates/orc-core", "crates/orc-server", "crates/orc-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/akakaplin/orc"

# Every third-party version is pinned here and referenced with `.workspace = true`,
# so the dependency budget in README.md has exactly one place to drift from.
[workspace.dependencies]
orc-core = { path = "crates/orc-core" }
orc-client = { path = "crates/orc-client" }

# Sanctioned: Parquet. `arrow` feature only -- default would also pull
# snap/brotli/flate2/lz4/base64/simdutf8. `crc` gates Parquet's own page
# checksums onto crc32fast, which we already depend on.
parquet = { version = "59.2", default-features = false, features = [
    "arrow",
    "zstd",
    "crc",
] }
# Deliberately the sub-crates, not the `arrow` umbrella: we only build RecordBatches.
arrow-array = "59.2"
arrow-schema = "59.2"

# Sanctioned: ZeroMQ. No `vendored` feature exists; zmq-sys carries zeromq-src as
# an unconditional build-dep and falls back to a source build with no system libzmq.
zmq = "0.10"

# Sanctioned: JSON. Config and manifest only.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Approved conveniences.
crc32fast = "1.5"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.6", features = ["derive"] }

# Dev only.
tempfile = "3.27"

[profile.release]
debug = 1
